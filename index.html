<!doctype html>
<html lang="ru" data-tg-bg-light="#f4f5f8" data-tg-bg-dark="#0e1117">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мои материалы</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
/* Router: t.me/<bot>/<app>?startapp=g37 → ./g37/
   Telegram hands the startapp value to the page twice: in initData (start_param)
   and as ?tgWebAppStartParam=… in the URL. ?p=g37 works in a plain browser. */
(function () {
  var q = new URLSearchParams(location.search);
  var tg = window.Telegram && Telegram.WebApp;
  var p = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || q.get('tgWebAppStartParam') || q.get('p');
  if (p && /^[A-Za-z0-9_-]{1,64}$/.test(p)) location.replace('./' + p + '/');
})();
</script>
<script src="tg.js"></script>
<style>
:root{--bg:#f4f5f8;--card:#fff;--ink:#121820;--mute:#5b6472;--line:#e1e4ea;--acc:#1240e0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1117;--card:#171b24;--ink:#e8ecf4;--mute:#9aa3b2;--line:#262c38;--acc:#6f8dff}}
:root[data-theme="dark"]{--bg:#0e1117;--card:#171b24;--ink:#e8ecf4;--mute:#9aa3b2;--line:#262c38;--acc:#6f8dff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:24px 16px 40px}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 20px}
a.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:10px;color:inherit;text-decoration:none}
a.card:hover,a.card:focus-visible{border-color:var(--acc);outline:none}
a.card b{display:block;font-size:17px;margin-bottom:2px}
a.card span{color:var(--mute);font-size:14.5px}
</style>
</head>
<body>
<main>
<h1>Мои материалы</h1>
<p class="sub">Выберите страницу.</p>
<div id="list"></div>
</main>
<script>
fetch('pages.json').then(r => r.json()).then(pages => {
  const list = document.getElementById('list');
  pages.forEach(p => {
    const a = document.createElement('a');
    a.className = 'card'; a.href = './' + p.slug + '/';
    const b = document.createElement('b'); b.textContent = p.title;
    const s = document.createElement('span'); s.textContent = p.desc;
    a.append(b, s); list.append(a);
  });
});
</script>
</body>
</html>
